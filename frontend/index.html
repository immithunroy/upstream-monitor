<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upstream Monitor</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="description" content="Upstream network monitoring - hourly traceroute & ping reports with change detection and RIR ASN attribution" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('upstream_theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
