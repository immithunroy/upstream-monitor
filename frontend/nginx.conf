server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # index.html must never be cached so browsers always fetch the latest
    # hashed JS/CSS bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
        try_files $uri =404;
    }

    location /api/ {
        # Re-resolve `backend` through Docker DNS. A fixed `proxy_pass http://backend`
        # is resolved once at nginx start; when containers restart in a different
        # order the backend gets a new IP and nginx keeps hitting the old one (502).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream backend:5020;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        # Hashed assets (assets/index-*.js/css) are content-addressed and safe to cache.
        location ~* \.(js|css|png|svg|ico|woff2?|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        try_files $uri $uri/ /index.html;
    }
}
