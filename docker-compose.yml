name: upstrean-monitor

services:
  postgres:
    image: postgres:18-alpine
    container_name: upstream-postgres
    restart: always
    # NEVER expose Postgres to the public internet. Bound to loopback only;
    # the backend reaches it over the internal docker network as `postgres`.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      TZ: Asia/Dhaka
      POSTGRES_DB: upstream_monitor
      POSTGRES_USER: ${POSTGRES_USER:-upstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres-password}

  backend:
    image: ghcr.io/immithunroy/upstream-monitor-backend:${UPSTREAM_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: upstream-backend
    restart: always
    ports:
      - '5020:5020'
    environment:
      NODE_ENV: production
      PORT: 5020
      TZ: Asia/Dhaka
      DATABASE_URL: postgresql://${POSTGRES_USER:-upstream}:${POSTGRES_PASSWORD:-change-me-postgres-password}@postgres:5432/upstream_monitor?schema=public
      TRACE_CRON: 0 */6 * * *
      PING_COUNT: 10
      PING_TIMEOUT_MS: 2500
      PING_INTERVAL_MINUTES: 5
      TRACEROUTE_MAX_HOPS: 30
      TRACEROUTE_TIMEOUT_SECONDS: 4
      RTT_CHANGE_PERCENT_THRESHOLD: 30
      RTT_CHANGE_ABS_THRESHOLD_MS: 15
      PACKET_LOSS_THRESHOLD: 5
      CORS_ORIGIN: '*'
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin-password}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-change-me-auth-token-secret}
      ADMIN_TOKEN_TTL_SECONDS: 43200
      RIR_REQUEST_TIMEOUT_MS: ${RIR_REQUEST_TIMEOUT_MS:-10000}
      RIR_ENRICH_CONCURRENCY: ${RIR_ENRICH_CONCURRENCY:-6}
      RIR_CACHE_TTL_HOURS: ${RIR_CACHE_TTL_HOURS:-24}
      RETENTION_DAYS: ${RETENTION_DAYS:-365}
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      - postgres

  frontend:
    image: ghcr.io/immithunroy/upstream-monitor-frontend:${UPSTREAM_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: upstream-frontend
    restart: always
    ports:
      - '8010:80'
    environment:
      TZ: Asia/Dhaka
    depends_on:
      - backend

volumes:
  postgres_data:
