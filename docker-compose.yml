services:
  mongodb:
    image: mongo:4.4-focal
    container_name: upstream-mongodb
    restart: always
    # NEVER expose Mongo to the public internet. Bound to loopback only;
    # the backend reaches it over the internal docker network as `mongodb`.
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: upstream_monitor
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change-me-mongo-password}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: upstream-backend
    restart: always
    ports:
      - '5020:5020'
    environment:
      NODE_ENV: production
      PORT: 5020
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-change-me-mongo-password}@mongodb:27017/upstream_monitor?authSource=admin
      TRACE_CRON: 0 * * * *
      PING_COUNT: 4
      PING_TIMEOUT_MS: 2500
      TRACEROUTE_MAX_HOPS: 30
      TRACEROUTE_TIMEOUT_SECONDS: 4
      RTT_CHANGE_PERCENT_THRESHOLD: 30
      RTT_CHANGE_ABS_THRESHOLD_MS: 15
      PACKET_LOSS_THRESHOLD: 5
      CORS_ORIGIN: '*'
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin-password}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-change-me-auth-token-secret}
      ADMIN_TOKEN_TTL_SECONDS: 43200
      RIR_REQUEST_TIMEOUT_MS: ${RIR_REQUEST_TIMEOUT_MS:-10000}
      RIR_ENRICH_CONCURRENCY: ${RIR_ENRICH_CONCURRENCY:-6}
      RIR_CACHE_TTL_HOURS: ${RIR_CACHE_TTL_HOURS:-24}
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: upstream-frontend
    restart: always
    ports:
      - '8010:80'
    depends_on:
      - backend

volumes:
  mongodb_data:
