name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: upstream-monitor-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/immithunroy/upstream-monitor-backend
  IMAGE_FRONTEND: ghcr.io/immithunroy/upstream-monitor-frontend

jobs:
  # ---------------------------------------------------------------------------
  # CI: typecheck + unit-ish tests + builds. Runs on every push and PR.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (backend)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend install
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Backend prisma generate
        working-directory: backend
        run: npx prisma generate

      - name: Backend typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Backend comparator tests
        working-directory: backend
        run: npm run test:comparator

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Setup Node.js (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  # CD: build images, push to GHCR (public repo => public images, no pull auth).
  # Only runs on push to master, after tests pass.
  # ---------------------------------------------------------------------------
  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy: SSH to the shared host and recreate ONLY this project's
  # backend + frontend containers. Postgres and every other app are untouched.
  # ---------------------------------------------------------------------------
  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || '22' }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync compose file (never touches .env)
        run: |
          scp -i ~/.ssh/deploy_key -P "${{ secrets.DEPLOY_PORT || '22' }}" \
            -o StrictHostKeyChecking=no \
            docker-compose.yml "${{ secrets.DEPLOY_USER || 'root' }}@${{ secrets.DEPLOY_HOST }}:/opt/upstrean-monitor/docker-compose.yml"

      - name: Pull images and recreate only this project's services
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT || '22' }}" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER || 'root' }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            cd /opt/upstrean-monitor
            echo "== freeing disk before pull =="
            # Remove all stale images of this project (in-use ones are kept
            # automatically), plus unreferenced dangling images and the shared
            # build cache. Running containers are untouched.
            docker image prune -f --filter "reference=ghcr.io/immithunroy/upstream-monitor-*" || true
            docker image prune -f --filter "dangling=true" || true
            docker builder prune -f || true
            echo "== pulling new images =="
            docker compose pull backend frontend
            echo "== recreating backend + frontend only =="
            docker compose up -d --no-deps --no-build backend frontend
            echo "== verifying =="
            sleep 5
            curl -fsS http://127.0.0.1:5020/api/health && echo " backend OK"
            curl -fsS -o /dev/null http://127.0.0.1:8010/ && echo " frontend OK"
            echo "== final prune: this project old images (never other apps) =="
            docker image prune -f --filter "reference=ghcr.io/immithunroy/upstream-monitor-*" || true
            docker image prune -f --filter "dangling=true" || true
          '

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Deployment to ${{ secrets.DEPLOY_HOST }} failed or health check failed."
